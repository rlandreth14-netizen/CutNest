name: Tests

on:
  push:
  pull_request:

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      # The content pages and the shared nav/footer are written by
      # tools/pages.py. Fail if the committed HTML is out of step with it.
      - name: Website pages are up to date
        run: python3 tools/pages.py && git diff --exit-code -- '*.html' sitemap.xml

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
